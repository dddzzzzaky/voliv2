<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voli Smash 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#e9e2d2;--ink:#1a2038;--a:#ff7a1a;--btn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1426;--ink:#f6efe2;--btn:#1d2a4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1426;--ink:#f6efe2;--btn:#1d2a4d;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:Bungee,Impact,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#wrap{position:relative;width:min(100vw,calc((100vh - 170px)*16/9),1280px);aspect-ratio:16/9;border-radius:10px;overflow:hidden;color:#fff;background:#0d1426}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.sb{position:absolute;top:2.5%;display:flex;align-items:center;gap:.6em;padding:.15em .8em;font-size:1.1em;transform:skewX(-10deg);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.sb span{font-size:2em}.sb.l{left:2%;background:#ff7a1a}.sb.r{right:2%;background:#19b6b0;flex-direction:row-reverse}
#mid{position:absolute;top:3%;width:100%;text-align:center;font-size:.9em;text-shadow:0 0 4px #000;line-height:1.5}
#pop{position:absolute;top:24%;width:100%;text-align:center;font-size:3.2em;opacity:0;text-shadow:-2px 0 #111,2px 0 #111,0 2px #111,0 -2px #111}
#pop.a{animation:pp .95s ease-out}
@keyframes pp{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
#hint{position:absolute;bottom:3%;width:100%;text-align:center;font-size:1em;text-shadow:0 0 4px #000,0 0 4px #000}
#gau{position:absolute;left:2%;top:15%;width:15%;font-size:.65em}
#gau div{background:rgba(8,12,28,.65);height:1.3em;margin-top:.3em;position:relative}
#gau i{position:absolute;left:0;top:0;bottom:0}#gau b{position:absolute;left:.4em;top:0;line-height:1.3em;font-weight:400}
#press{position:absolute;left:35%;width:30%;top:57%;text-align:center;font-size:.7em;color:#ffb3b3;text-shadow:0 0 3px #000}
#bar{position:absolute;left:35%;top:62%;width:30%;height:1.3em;background:linear-gradient(90deg,#c0392b 25%,#f1c40f 25% 75%,#c0392b 75%);display:none;border:2px solid #111}
#gz{position:absolute;top:0;bottom:0;background:#2ecc71}#cur{position:absolute;top:-.3em;bottom:-.3em;width:.35em;background:#fff;border:1px solid #111}
#fx{position:absolute;inset:0;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 42%,#000 0 2.5deg,#fff 2.5deg 6deg);-webkit-mask-image:radial-gradient(circle at 50% 42%,transparent 16%,#000 62%);mask-image:radial-gradient(circle at 50% 42%,transparent 16%,#000 62%);display:flex;align-items:center;justify-content:center;font-size:7em;color:#ff4d6d;-webkit-text-stroke:2px #111}
#fx.on{animation:fxa .7s ease-out}@keyframes fxa{0%{opacity:.95}100%{opacity:0}}
#ov{position:absolute;inset:0;background:rgba(8,12,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em;font-size:1em}
#ov h1{margin:0;font-size:3.4em;color:#ff7a1a}#ov p{margin:0;font-size:.85em;line-height:1.5;font-family:system-ui,sans-serif;font-weight:700}
#pad{width:min(100vw,960px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;padding:0 14px;box-sizing:border-box;gap:4px}
.dp{position:relative;width:124px;height:124px;flex:none}
#stk{position:relative;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,#ffffff14 0,#ffffff0a 60%,#ffffff22 100%);border:2px solid var(--a);box-sizing:border-box;touch-action:none;opacity:.85}
#stk::before{content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed #ffffff44}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--a);border:2px solid #111;box-shadow:0 3px 0 #0006;pointer-events:none;will-change:transform}
.g{display:flex;gap:8px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--btn);border:2px solid var(--a);border-radius:14px;min-width:52px;height:52px;touch-action:none}
button:active,button.sel{background:var(--a);color:#161616}
#bdv,#bsk{min-width:56px;height:56px;font-size:11px}#bsk{border-color:#ffe14d}#bsk.dis{opacity:.45}
#ov{pointer-events:auto}#ov button{pointer-events:auto;height:40px;font-size:13px;padding:0 14px}
.rowc{display:flex;align-items:center;gap:.8em;font-size:.8em;font-family:system-ui,sans-serif;font-weight:700;text-align:left}
.rowc .xb{width:6em;height:.7em;background:#222;border-radius:3px;overflow:hidden}.rowc .xb i{display:block;height:100%;background:#7dff9a}
#bh{background:var(--a);color:#161616;min-width:84px;height:72px}#bj{height:72px;min-width:78px}
#ctx,#bdv,#bsk{display:none!important}#bh{min-width:104px;height:86px;font-size:18px}#bj{min-width:88px;height:86px}
#ctx{display:flex;flex-direction:column;gap:4px;align-items:center}
.cg{display:flex;gap:4px;align-items:center;transition:opacity .15s}
.cg.off{opacity:.3}
.cg button{min-width:40px;height:34px;font-size:11px;border-radius:10px;padding:0 6px}
.cg button.dis{opacity:.3}
.cl{font-size:9px;opacity:.7;width:46px;text-align:right}
@media (max-width:620px){#ctx{order:-1;width:100%}}
@media (orientation:portrait) and (max-width:900px){   /* HP portrait: putar layar game jadi landscape */
 html{overflow:hidden}
 body{position:fixed;top:0;left:100vw;left:100dvw;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:rotate(90deg);gap:0;justify-content:flex-start}
 #wrap{width:min(100vh,100vw*16/9);width:min(100dvh,100dvw*16/9);border-radius:0}
 #pad{position:fixed;left:0;right:0;bottom:0;pointer-events:none;padding:0 12px 6px;width:100%;max-width:none;flex-wrap:nowrap}
 #pad>*{pointer-events:auto}
 button{opacity:.8}
 #hint{bottom:auto;top:16%}
 #ctx{order:0;width:auto}
}
@media (max-height:520px) and (orientation:landscape){
 body{gap:0;justify-content:flex-start}
 #wrap{width:min(100vw,100vh*16/9);border-radius:0}
 #pad{position:fixed;left:0;right:0;bottom:0;pointer-events:none;padding:0 12px calc(6px + env(safe-area-inset-bottom,0px));width:100vw;max-width:none;flex-wrap:nowrap}
 #pad>*{pointer-events:auto}
 button{opacity:.8}
 #hint{bottom:auto;top:16%}
 #ctx{order:0;width:auto}
}

#cut{position:absolute;left:-45%;bottom:20%;width:32%;transform:skewX(-8deg);border:.25em solid #fff;box-shadow:.3em .3em 0 #111;background:#111;transition:left .22s cubic-bezier(.2,1.2,.4,1),right .22s;overflow:hidden}
#cut.in{left:2%}#cut.r{left:auto;right:-45%}#cut.r.in{right:2%;left:auto}
#cut canvas{position:static;display:block;width:100%;height:auto;transform:skewX(8deg) scale(1.15)}
#cutt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#111e,#1110);padding:.2em .8em;font-size:.9em;color:#ffe14d;display:flex;flex-direction:column;transform:skewX(8deg)}
#cutt small{font-size:.6em;color:#fff;font-family:system-ui,sans-serif;font-weight:700}
#hf{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle,#000 34%,transparent 36%) 0 0/9px 9px,#fff;clip-path:polygon(0 30%,100% 5%,100% 60%,0 90%);mix-blend-mode:multiply}
#hf.on{animation:hfa .6s ease-out}@keyframes hfa{0%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
#bs{position:absolute;left:-10%;top:38%;width:120%;height:16%;background:var(--tc,#ff7a1a);opacity:0;transform:rotate(-8deg);clip-path:polygon(0 18%,6% 0,20% 14%,38% 2%,55% 16%,74% 0,90% 12%,100% 4%,100% 82%,92% 100%,76% 84%,58% 100%,40% 86%,22% 100%,8% 84%,0 96%)}
#bs.on{animation:bsa .5s ease-out}@keyframes bsa{0%{opacity:0;transform:translateX(-30%) rotate(-8deg)}25%{opacity:.85}100%{opacity:0;transform:translateX(15%) rotate(-8deg)}}
.sfxt{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg)) skewX(-10deg);font-family:'Dela Gothic One',Bungee,Impact,sans-serif;font-size:3em;color:#ffe14d;-webkit-text-stroke:.07em #111;paint-order:stroke fill;text-shadow:.06em .06em 0 #111;animation:sfxa .7s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes sfxa{0%{transform:translate(-50%,-50%) rotate(var(--r)) skewX(-10deg) scale(.3);opacity:0}15%{transform:translate(-50%,-60%) rotate(var(--r)) skewX(-10deg) scale(1.25);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) rotate(var(--r)) skewX(-10deg) scale(1);opacity:0}}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55) 100%)}
#bl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.35;filter:blur(6px) brightness(1.35) saturate(1.3)}
#fx2d{pointer-events:none}
#lbt,#lbb{position:absolute;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .28s cubic-bezier(.2,.8,.2,1)}
#lbt{top:0}#lbb{bottom:0}
#wrap.cine #lbt,#wrap.cine #lbb{height:11%}
#wrap.cine #hint{opacity:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fla .32s ease-out}@keyframes fla{0%{opacity:.85}100%{opacity:0}}
#cap{position:absolute;left:0;right:0;bottom:2.4%;text-align:center;font-size:1em;letter-spacing:.08em;color:#ffe14d;opacity:0;transform:translateY(.5em);transition:opacity .25s .25s,transform .25s .25s;pointer-events:none;text-shadow:0 0 .6em #000}
#cap.on{opacity:1;transform:none}
#cap small{color:#fff;font-size:.7em;margin-left:.8em;font-family:system-ui,sans-serif;font-weight:700}
.sb span{text-shadow:0 0 .3em rgba(255,255,255,.7)}
#rpl{position:absolute;inset:0;pointer-events:none;display:none}
#rpl i{position:absolute;left:0;right:0;height:11%;background:#000}#rpl i:first-child{top:0}#rpl i:last-child{bottom:0}
#rpl b{position:absolute;left:3%;top:13%;color:#ff4d6d;font-size:1.3em;animation:bk 1s steps(2) infinite;text-shadow:0 0 4px #000}
@keyframes bk{50%{opacity:.2}}
#ov{overflow:auto;padding:.5em 0;box-sizing:border-box;justify-content:flex-start}
#ov h1{flex:none}#ov::before,#ov::after{content:"";margin:auto}
#ov button.big{width:15em;height:2.8em;font-size:1em;margin:.15em;border-radius:12px;flex:none}
#ov button.big.pri{background:var(--a);color:#161616}
.br{display:flex;gap:.9em;font-family:system-ui,sans-serif;font-weight:700;font-size:.72em;align-items:stretch;text-align:left}
.br .col{display:flex;flex-direction:column;justify-content:space-around;gap:.5em}
.br h4{margin:0;text-align:center;font-size:.9em;color:#ffd23f}
.mt{background:#1d2a4d;border:2px solid #ffffff33;border-radius:6px;padding:.3em .5em;min-width:9.5em}.mt.me{border-color:#ffd23f}.mt.cur{box-shadow:0 0 .8em #ffd23f}
.mt div{display:flex;justify-content:space-between;gap:.6em}.mt .l{opacity:.5}.mt .w{color:#fff}.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em}
.stt{font-family:system-ui,sans-serif;font-weight:700;font-size:.78em;border-collapse:collapse}.stt td{padding:.12em .9em;border-bottom:1px solid #ffffff22}.stt td:nth-child(2),.stt td:nth-child(3){text-align:center}
.stt tr.hl td{color:#ffd23f}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas><canvas id="bl" width="160" height="90"></canvas><div id="vg"></div><canvas id="fx2d"></canvas><div id="lbt"></div><div id="lbb"></div><div id="flash"></div><div id="cap"></div>
<div id="ui">
 <div class="sb l" id="sb0"><b id="n0">KAMU</b><span id="s0">0</span></div><div class="sb r" id="sb1"><b id="n1">LAWAN</b><span id="s1">0</span></div>
 <div id="mid"></div><div id="pop"></div><div id="hint"></div>
 <div id="gau"><div><i id="g0"></i><b>SUPER</b></div><div><i id="g1"></i><b>STAMINA</b></div><div><i id="g2"></i><b>MENTAL</b></div></div>
 <div id="press"></div>
 <div id="bar"><i id="gz"></i><i id="cur"></i></div>
 <div id="fx">ドン!</div>
 <div id="hf"></div><div id="bs"></div>
 <div id="cut"><canvas id="cutc" width="220" height="160"></canvas><div id="cutt"></div></div>
 <button id="bmn" style="position:absolute;right:2%;top:27%;pointer-events:auto;height:26px;min-width:44px;font-size:13px;border-radius:8px">☰</button>
 <button id="bmu" style="position:absolute;right:2%;top:21%;pointer-events:auto;height:26px;min-width:44px;font-size:12px;border-radius:8px">🔊</button>
 <div id="rpl"><i></i><i></i><b>REPLAY</b></div>
 <button id="bfx" class="sel" style="position:absolute;right:2%;top:15%;pointer-events:auto;height:26px;min-width:44px;font-size:10px;border-radius:8px">FX</button>
 <button id="bcn" class="sel" style="position:absolute;right:2%;top:27%;pointer-events:auto;height:26px;min-width:44px;font-size:12px;border-radius:8px">🎬</button>
 <div id="ov"></div>
</div></div>
<div id="pad">
 <div class="dp"><div id="stk"><div id="knob"></div></div></div>
 <div id="ctx">
  <div class="cg" id="cg-set"><span class="cl">TEMPO</span><button data-t="A">A</button><button data-t="B">B</button><button data-t="C">C</button><button data-t="OPEN">OPEN</button><button data-t="PIPE">PIPE</button></div>
  <div class="cg" id="cg-srv"><span class="cl">SERVIS</span><button data-v="float">FLOAT</button><button data-v="jf">J.FLOAT</button><button data-v="js">JUMP</button></div>
  <div class="cg" id="cg-spk"><span class="cl">PUKULAN</span><button data-s="roll">ROLL</button><button data-s="tip">TIP</button><button data-s="wipe">WIPE</button></div>
 </div>
 <div class="g"><button id="bdv">DIVE</button><button id="bsk">SKILL</button><button id="bj">LOMPAT</button><button id="bh">HIT</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:1;
const NETH=2.43,BR=.21,G=12,CX=9,ZS=2.0,CZ=4.5*ZS,DT=1/60;   // ZS = faktor lebar lapangan
let WIN=15;
const ROLES=['LIBERO','SETTER','ACE','MIDDLE'];
const IDLE=[6.5,2.3,3.6,2.9],IDZ=[0,.6,-2.5,1.6].map(v=>v*ZS),NUM=[[1,12,10,7],[3,6,11,9]];   // libero, setter, ace, middle
let AC=null;

/* ---------- input ---------- */
const K={l:0,r:0,f:0,b:0,j:0};let hp=0,dvp=0,skp=0,tsel=null,shsel=null;
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'f',w:'f',W:'f',ArrowDown:'b',s:'b',S:'b',' ':'j'};
const kv={'6':'float','7':'jf','8':'js'},kt={'1':'A','2':'B','3':'C','4':'OPEN','5':'PIPE'},ks={q:'roll',Q:'roll',e:'tip',E:'tip',r:'wipe',R:'wipe'};
addEventListener('keydown',e=>{initAudio();const m=km[e.key];if(m){K[m]=1;e.preventDefault()}
 if(['j','J','z','Z','Enter'].includes(e.key)){if(!e.repeat)hp=6;e.preventDefault()}
 if(kt[e.key]&&!e.repeat)pickTempo(kt[e.key]);
 if(ks[e.key]&&!e.repeat)pickShot(ks[e.key]);
 if(kv[e.key])svsel=kv[e.key];
 if(['x','X'].includes(e.key)&&!e.repeat)dvp=8;
 if(['c','C'].includes(e.key)&&!e.repeat)skp=8;});
addEventListener('keyup',e=>{const m=km[e.key];if(m)K[m]=0});
function hold(id,k){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>K[k]=0))}
hold('bj','j');
/* ---------- analog stick ---------- */
(()=>{const st=$('stk'),kn=$('knob');let pid=null;const R=44,DZ=.25;
 const ax=v=>{const a=Math.abs(v);return a<DZ?0:Math.sign(v)*(a-DZ)/(1-DZ)};
 const rot=()=>matchMedia('(orientation:portrait) and (max-width:900px)').matches;   // layar diputar 90° via CSS
 function upd(e){const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let sx=e.clientX-cx,sy=e.clientY-cy;
  let dx=sx,dy=sy;if(rot()){dx=sy;dy=-sx}
  const d=Math.hypot(dx,dy),m=Math.min(1,d/R),nx=d?dx/d:0,ny=d?dy/d:0;
  kn.style.transform='translate('+nx*m*R*.8+'px,'+ny*m*R*.8+'px)';
  const vx=ax(nx*m),vy=ax(ny*m);
  K.r=Math.max(0,vx);K.l=Math.max(0,-vx);K.b=Math.max(0,vy);K.f=Math.max(0,-vy)}
 function end(e){if(e.pointerId!==pid)return;pid=null;kn.style.transform='';K.l=K.r=K.f=K.b=0}
 st.addEventListener('pointerdown',e=>{if(pid!==null)return;e.preventDefault();pid=e.pointerId;try{st.setPointerCapture(pid)}catch(_){}upd(e)});
 st.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();upd(e)}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>st.addEventListener(n,end))})();
$('bh').addEventListener('pointerdown',e=>{e.preventDefault();hp=6});
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();pickTempo(b.dataset.t)}));
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();pickShot(b.dataset.s)}));
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();svsel=b.dataset.v}));
$('bdv').addEventListener('pointerdown',e=>{e.preventDefault();dvp=8});
let lastJ=0;$('bj').addEventListener('pointerdown',()=>{const n=performance.now();if(n-lastJ<320)skp=8;lastJ=n});   // ketuk LOMPAT 2x = SKILL
addEventListener('pointerdown',()=>{initAudio();if(coarse&&!document.fullscreenElement&&document.documentElement.requestFullscreen){try{document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}}},{passive:true});

/* ---------- audio: sfx, sorak penonton mengikuti rally, musik yang menegang saat clutch ---------- */
let mst=null,crowdG=null,noiseBuf=null,muted=false,musG=null,mNext=0,mStep=0,cheerT=0;
try{muted=localStorage.getItem('voli3d.mute')==='1'}catch(e){}
function initAudio(){
 try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
   mst=AC.createGain();mst.gain.value=muted?0:1;mst.connect(AC.destination);
   noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=.6;crowdG=AC.createGain();crowdG.gain.value=0;n.connect(f);f.connect(crowdG);crowdG.connect(mst);n.start();
   musG=AC.createGain();musG.gain.value=.5;musG.connect(mst)}
  if(AC.state==='suspended')AC.resume()}catch(e){}}
function sfx(f,d=.08,type='square',v=.05){try{if(!AC||!mst)return;const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.value=f;a.gain.value=v;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a);a.connect(mst);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function noise(d,fq,v,type='lowpass'){try{if(!AC||!mst)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;const g=AC.createGain();g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);s.connect(f);f.connect(g);g.connect(mst);s.start();s.stop(AC.currentTime+d)}catch(e){}}
/* ---------- suara pukulan realistis: transien telapak + resonansi bola + dentuman bass + gema gedung olahraga ---------- */
let hitBus=null;
function hitInit(){if(hitBus||!AC)return;

/* ---------- mode: menu, turnamen + bagan, latihan, statistik akhir, pengaturan ---------- */
let scr='',paused=false,drill='free',tour=null,curOpp=null,reported=false;
const OPPS=[{n:'ELANG BIRU',col:0x2f6df6,df:.25},{n:'BANTENG MERAH',col:0xe03a3a,df:.35},{n:'RIMBA HIJAU',col:0x2ecc71,df:.45},{n:'GAGAK UNGU',col:0x9b59ff,df:.55},{n:'MACAN PINK',col:0xff4d9a,df:.65},{n:'BADAI PUTIH',col:0xcfd8e8,df:.78},{n:'NAGA GELAP',col:0xc2182b,df:.92}];
const RNAME=['PEREMPAT FINAL','SEMIFINAL','FINAL'],RWIN=[11,13,15];
const ME={n:'KAMU',col:0xff7a1a,df:.6};
function oppHairs(col){const p=[0xffffff,0xffe14d,0x6df0ff,0xff4d9a,0x9dff6a,0xffa23d].sort(()=>rnd()-.5);return p.slice(0,4)}
function startMatch(kind,opp,w){
 mode=kind;WIN=w||15;paused=false;scr='';curOpp=opp||{n:'LAWAN',col:0x19b6b0,df:.5,hairs:HAIRS[1]};
 const tm=T[1];tm.col=curOpp.col;tm.name=curOpp.n;tm.hairs=curOpp.hairs||(curOpp.hairs=oppHairs(curOpp.col));tm.diff=curOpp.df;setAiLevels(tm,curOpp.df);restyle(tm);
 T[0].diff=.5;$('n1').textContent=tm.name;$('n0').textContent='KAMU';
 T.forEach(t=>{t.score=0;t.sg=0;t.stam=100;t.ment=50;t.sync=0;t.stat=newStat()});
 reported=false;rp=null;rpPend=false;$('rpl').style.display='none';sv=kind==='practice'&&(drill==='recv'||drill==='def')?1:0;
 $('ov').style.display='none';setup()}
/* ----- turnamen ----- */
function newTour(){const o=OPPS.slice().sort(()=>rnd()-.5);o.forEach(x=>x.hairs=oppHairs(x.col));
 tour={teams:[ME,...o],br:[[0,1,2,3,4,5,6,7]],sc:[[],[],[]],r:0,alive:true,done:false}
 // acak posisi lawan di bagan, pemain tetap di slot 0
 const rest=[1,2,3,4,5,6,7].sort(()=>rnd()-.5);tour.br[0]=[0,...rest]}
function tourOpp(){const b=tour.br[tour.r],i=b.indexOf(0),j=i%2?i-1:i+1;return tour.teams[b[j]]}
function simRound(r){   // simulasikan pertandingan lain di ronde r, lalu bentuk ronde berikutnya
 const b=tour.br[r],nxt=[];
 for(let k=0;k<b.length/2;k++){const a=b[2*k],c=b[2*k+1];let w;
  if(tour.sc[r][k])w=tour.sc[r][k].w;
  else{const sa=tour.teams[a].df+.05,sc=tour.teams[c].df+.05,pa=sa/(sa+sc);w=rnd()<pa?a:c;const lo=5+Math.floor(rnd()*(RWIN[r]-5));tour.sc[r][k]={w,s:w===a?[RWIN[r],lo]:[lo,RWIN[r]]}}
  nxt.push(w)}
 tour.br[r+1]=nxt}
function tourReport(win,me,op){
 const r=tour.r,b=tour.br[r],k=Math.floor(b.indexOf(0)/2),i=b.indexOf(0)%2;
 tour.sc[r][k]={w:win?0:b[i?k*2:k*2+1],s:i?[op,me]:[me,op]};
 simRound(r);
 if(win){if(r===2){tour.done=true}else tour.r=r+1}
 else{tour.alive=false;for(let q=r+1;q<3;q++)simRound(q)}}
function bracketHTML(){
 let h='<h1 style="font-size:2em">BAGAN TURNAMEN</h1><div class="br">';
 for(let r=0;r<3;r++){h+='<div class="col"><h4>'+RNAME[r]+'</h4>';const b=tour.br[r];
  for(let k=0;k<(r===0?4:r===1?2:1);k++){
   const a=b&&b[2*k],c=b&&b[2*k+1],sc=tour.sc[r][k],cur=tour.alive&&!tour.done&&tour.r===r&&b&&(a===0||c===0);
   const line=(ti,i)=>{if(ti===undefined)return'<div><span>?</span></div>';const t=tour.teams[ti],w=sc?sc.w===ti:null;
    return'<div class="'+(sc?(w?'w':'l'):'')+'"><span><i class="dot" style="background:'+hx(t.col)+'"></i>'+t.n+'</span><span>'+(sc?sc.s[i]:'')+'</span></div>'};
   h+='<div class="mt'+(b&&(a===0||c===0)?' me':'')+(cur?' cur':'')+'">'+line(a,0)+line(c,1)+'</div>'}
  h+='</div>'}
 const champ=tour.done?0:tour.br[3]&&tour.br[3][0];
 h+='<div class="col"><h4>JUARA</h4><div class="mt'+(champ===0?' me':'')+'">'+(champ!==undefined?'<div class="w"><span>🏆 '+tour.teams[champ].n+'</span></div>':'<div><span>?</span></div>')+'</div></div></div>';
 const nm=tour.alive&&!tour.done?'<p style="color:#ffd23f">Lawan berikutnya: '+tourOpp().n+' · sampai '+RWIN[tour.r]+' poin</p><button class="big pri" onclick="tourPlay()">MAIN</button>'
  :tour.done?'<p style="color:#ffd23f;font-size:1.2em">KAMU JUARA! 🏆</p>':'<p>Kamu tersingkir. Coba lagi!</p>';
 return h+nm+'<button class="big" onclick="toMenu()">MENU</button>'}
function tourPlay(){startMatch('tour',tourOpp(),RWIN[tour.r])}
